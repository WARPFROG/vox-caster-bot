name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o vox-caster-bot-linux-amd64 ./cmd/vox-caster-bot

      - name: Generate checksums
        if: github.event_name == 'push'
        run: sha256sum vox-caster-bot-linux-amd64 > SHA256SUMS

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          files: |
            vox-caster-bot-linux-amd64
            SHA256SUMS

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/warpfrog/vox-caster-bot
          # latest is owned by the main-branch deploy workflow; releases only
          # publish immutable semver tags so an old release can't move prod back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
